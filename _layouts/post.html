---
layout: default
---
{%- assign fmt = page.date_format | default: '%B %Y' %}
<article class="container page">
  <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: fmt }}</time></p>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
    {%- if page.link %}<p><a class="button" href="{{ page.link | relative_url }}">More</a></p>{% endif %}
  </div>
</article>
