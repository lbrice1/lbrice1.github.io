<div class="graph" hidden>
  <p class="graph__note">{{ include.label }} (circles) linked to topics (labeled nodes). Hover or focus for details; click to open; scroll to zoom; drag to pan.</p>
  <div class="graph__canvas"></div>
</div>
<script type="application/json" class="graph-data">
{
  "topics": [{% for t in site.data.topics %}{"key": {{ t.key | jsonify }}, "label": {{ t.label | jsonify }}, "color": {{ t.color | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "items": [{% for p in include.items %}{"title": {{ p.title | jsonify }}, "year": "{{ p.date | date: '%Y' }}", "venue": {{ p.venue | default: '' | jsonify }}, "url": {{ p.url | relative_url | jsonify }}, "topics": {{ p.topics | default: empty | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
