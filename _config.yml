# Site configuration for lbrice1.github.io.
# Built by GitHub Pages (legacy build, github-pages gem). Restart `jekyll serve` after editing.

locale       : "en-US"
lang         : "en"
title        : "Luis A. Briceno-Mena"
tagline      : "Scientific machine learning · Process systems engineering · Research software"
description  : "Scientific machine learning and research software for process systems engineering, in Data and Intelligent Systems at Princeton University."
url          : "https://lbrice1.github.io"
baseurl      : ""
repository   : "lbrice1/lbrice1.github.io"
timezone     : America/New_York
# The AIChE talk and other scheduled items are listed before their date.
future       : true
# No gem theme: GitHub Pages would otherwise add jekyll-theme-primer assets.
theme        : null

author:
  name         : "Luis A. Briceno-Mena"
  portrait     : "/images/portrait.jpg"
  affiliation  : "Data and Intelligent Systems"
  institution  : "Princeton University"
  location     : "Princeton, NJ"
  # Rendered as "lbriceno [at] princeton [dot] edu"; never as a mailto link.
  email_user   : "lbriceno"
  email_domain : "princeton [dot] edu"
  googlescholar: "https://scholar.google.com/citations?user=5VFIGQoAAAAJ"
  orcid        : "https://orcid.org/0000-0003-3684-4232"
  github       : "https://github.com/lbrice1"
  linkedin     : "https://www.linkedin.com/in/luisbricenomena"

affiliations:
  - name: "Data and Intelligent Systems, Princeton University"
    url : "https://dais.princeton.edu"

# jekyll-seo-tag
social:
  name: "Luis A. Briceno-Mena"
  links:
    - "https://scholar.google.com/citations?user=5VFIGQoAAAAJ"
    - "https://orcid.org/0000-0003-3684-4232"
    - "https://github.com/lbrice1"
    - "https://www.linkedin.com/in/luisbricenomena"

include:
  - _pages
exclude:
  - ref.bib
  - scripts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - "*.ipynb"
  - node_modules
  - vendor
  - .bundle

markdown      : kramdown
highlighter   : rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output   : true
    permalink: /publication/:path/
  talks:
    output   : true
    permalink: /talks/:path/
  teaching:
    output   : true
    permalink: /teaching/:path/

permalink: /news/:year/:month/:title/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication }
  - scope: { path: "", type: talks }
    values: { layout: talk }
  - scope: { path: "", type: teaching }
    values: { layout: teaching }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: feed.xml
